name: Verify Release upload and download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-upload-check.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the upload tool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Upload, publish a test prerelease, and download without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'GitHub Release upload and download verification.\nRun: %s\n' "$GITHUB_RUN_ID" > upload-download-check.txt
          python3 tools/release_upload.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "upload-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --title "GitHub 上传下载验证" \
            --publish --prerelease --verify-public \
            upload-download-check.txt tools/release_upload.py
          {
            printf '### 上传和公开下载校验通过\n\n'
            printf '已逐个回下载，并校验文件大小和 SHA-256。\n\n'
            printf '[下载页面](https://github.com/%s/releases/tag/upload-check-%s-%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
